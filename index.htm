<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Technology cost evolution simulation</title>
  </head>
  <body>
    <div class="container">
      <h1>Technology cost evolution simulation</h1>
      <div class="controls">
        <ul class="list-controls">
          <li>
            <label for="numComponents">Number of components:</label>
            <input
              type="number"
              id="numComponents"
              value="10"
              min="2"
              onchange="validateInputs()"
            />
          </li>
          <li>
            <label for="connectivity">Dependencies:</label>
            <input
              type="number"
              id="connectivity"
              value="2"
              min="1"
              onchange="validateInputs()"
              oninput="validateInputs()"
            />
          </li>
          <li>
            <label for="generationMethod">Generation method:</label>
            <select id="generationMethod" onchange="runSimulation()">
              <option value="fixed">Fixed out-degree</option>
              <option value="random">Variable out degree</option>
            </select>
          </li>
          <li>
            <button id="runSimulationButton" onclick="runSimulation()">
              Run simulation
            </button>
          </li>
        </ul>
      </div>
      <div class="output">
        <div
          id="loadingIndicator"
          style="display: none; text-align: center; margin-top: 10px; color: #333;"
        >
          <p>Simulation complete. Please check the console (Inspect > Console) for detailed information about the selected components, affected components, and updated costs.</p>
        </div>
        <div class="horizontal-container" style="display: flex; gap: 24px; justify-content: center; align-items: flex-start;">
          <div class="dsm-section" style="flex: 0 0 180px; max-width: 180px;">
            <h2 style="font-size: 1.1em; margin-bottom: 8px;">Generated DSM</h2>
            <div id="dsmContainer"
                 style="width: 180px; height: 180px; max-width: 180px; max-height: 180px; overflow-y: auto; overflow-x: hidden; background: #f5f5f5; border-radius: 8px; padding: 8px; box-sizing: border-box;">
            </div>
          </div>
          <div class="graph-section" style="flex: 1 1 320px; min-width: 240px; max-width: 600px;">
            <canvas id="costChart"></canvas>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
